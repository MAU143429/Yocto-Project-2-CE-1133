<div *ngIf="registro">
  <app-register></app-register>
</div>

<div *ngIf="!registro">
      <div *ngIf="entrada">
        <app-login></app-login>
      </div>
      
      <!-- Solo muestra app-base si NO está en modo entrada Y usuario no está vacío -->
      <div *ngIf="!entrada && usuario !== ''">
        <app-base></app-base>
      </div>
</div>
