<div class="">

    <div class="container">

        <div class="card o-hidden border-0 shadow-lg my-5">
            <div class="card-body p-0 bg-gradient-primary">
                <!-- Nested Row within Card Body -->
                <div class="row">
                    <div class="col-lg-5 d-none d-lg-block bg-register-image"></div>
                    <div class="col-lg-7">
                        <div class="p-5">
                            <div class="text-center">
                                <h1 class="h4 mb-4 text-white">Create an Account!</h1>
                            </div>


                            <form #datos="ngForm" (ngSubmit)="registrarse(datos)" class="user">
                                <div class="form-group">
                                    <input type="text" name="username" class="form-control form-control-user" id="exampleInputEmail" placeholder="Username" ngModel>
                                </div>
                                <div class="form-group row">
                                    <div class="col-sm-6 mb-3 mb-sm-0">
                                        <input name="password1" type="password" class="form-control form-control-user" id="exampleInputPassword" placeholder="Password" ngModel>
                                    </div>
                                    <div class="col-sm-6">
                                        <input name="password2" type="password" class="form-control form-control-user" id="exampleRepeatPassword" placeholder="Repeat Password" ngModel>
                                    </div>
                                </div>
                                <button type="submit" class="btn btn-google btn-user btn-block">
                                    Register Account
                                </button>
                            </form>


                            <hr>
                            <div class="text-center">
                                <a (click)="cambiarRegister()" class="small text-white">Already have an account? Login!</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>
</div>
